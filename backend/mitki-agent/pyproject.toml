[project]
name = "mitki_agent"
version = "0.1.0"
description = "mitki-agent"
requires-python = ">=3.12"

dependencies = [
    "aegra-cli>=0.10.5",
    "langgraph>=1.0.8",
    "langchain>=0.3.14",
    "langchain-openai>=0.3.0",
    "langchain-openrouter>=0.2.7",
    "langchain-anthropic>=0.3.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mitki_agent"]
