[project]
name = "mit_kit_agent_server"
version = "0.1.0"
description = "mit-ki-agent-server"
requires-python = ">=3.12"

dependencies = [
    "aegra-cli>=0.10.6",
    "langgraph>=1.2.12",
    "langchain>=1.4.2",
    "langchain-openai>=1.6.6",
    "langchain-openrouter>=0.2.7",
    "langchain-anthropic>=1.7.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents"]
